services:
  - type: web
    name: taskflow-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: allam-2-7b
      - key: ALLOWED_ORIGIN
        value: https://glassboard-ten.vercel.app
      - key: JWT_SECRET_KEY
        sync: false
